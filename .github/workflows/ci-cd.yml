name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # CI : compilation (typecheck + build Next.js) sur chaque push / PR
  # ------------------------------------------------------------------
  build:
    name: Build & vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build Next.js (inclut le typecheck)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # ------------------------------------------------------------------
  # CD : image Docker poussée sur GHCR, puis déploiement SSH (main)
  # ------------------------------------------------------------------
  deploy:
    name: Image GHCR + déploiement serveur
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Métadonnées (tags image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=short

      - name: BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déployer sur le serveur (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ vars.APP_DIR || '/opt/multiboutique' }}"
            git pull --ff-only origin main || true
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
            bash deploy/server-deploy.sh up