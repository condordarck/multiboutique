name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

# Un seul déploiement à la fois : deux pushes rapprochés lanceraient git pull
# et compose up en parallèle dans le même répertoire sur le serveur.
concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # CI : compilation (typecheck + build Next.js) sur chaque push / PR
  # ------------------------------------------------------------------
  build:
    name: Build & vérifications
    runs-on: ubuntu-latest
    # PostgreSQL réel pour les tests d'intégration de l'API (base clonée par
    # fichier de test, cf. apps/api/test/base.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests des workspaces
        run: npm test
        env:
          DATABASE_URL_TEST: postgres://postgres:test@localhost:5432/postgres

      - name: Typecheck des workspaces
        run: npm run typecheck

      - name: Build des workspaces
        run: npm run build:workspaces

      - name: Build Next.js (inclut le typecheck)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # ------------------------------------------------------------------
  # CD recette : push sur main → serveur de recette
  # ------------------------------------------------------------------
  deploy-recette:
    name: Déploiement recette
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: recette
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Métadonnées (tags image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short

      - name: BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Métadonnées (tags image API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & push de l'image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Déployer sur le serveur (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ vars.APP_DIR || '/var/www/multiboutique' }}"
            # Sans échec ici, une image neuve se déploierait sur un checkout
            # périmé : ancien compose, anciennes migrations, anciens scripts.
            git pull --ff-only origin main
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.meta-api.outputs.version }}"
            bash deploy/server-deploy.sh up

      - name: Vérifier la santé de l'application
        run: |
          for tentative in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://${{ vars.DOMAIN }}/api/health")
            echo "Tentative ${tentative} : HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Application saine."
              exit 0
            fi
            sleep 10
          done
          echo "L'application ne répond pas 200 sur /api/health après déploiement." >&2
          exit 1

      # Tant que API_DOMAIN n'est pas défini (tunnel pas encore créé), l'API n'est
      # pas déployée par server-deploy.sh : rien à vérifier.
      - name: Vérifier la santé de l'API
        if: vars.API_DOMAIN != ''
        run: |
          for tentative in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://${{ vars.API_DOMAIN }}/health")
            echo "Tentative ${tentative} : HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "API saine."
              exit 0
            fi
            sleep 10
          done
          echo "L'API ne répond pas 200 sur /health après déploiement." >&2
          exit 1

  # ------------------------------------------------------------------
  # CD recette des PWA : push sur main → Cloudflare Workers (fichiers statiques)
  #
  # Un Worker par front ET par environnement (mb-<front>-recette, voir
  # apps/<front>/wrangler.jsonc) : un déploiement de recette ne peut jamais
  # atteindre la production. Le déploiement crée lui-même le domaine
  # personnalisé et son enregistrement DNS.
  # ------------------------------------------------------------------
  deploy-fronts-recette:
    name: Fronts recette (${{ matrix.front }})
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: recette
    permissions:
      contents: read
    strategy:
      # Les fronts sont indépendants : l'échec de l'un ne doit pas annuler
      # le déploiement de l'autre.
      fail-fast: false
      matrix:
        front: [www, backoffice, maquettes]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build -w @multiboutique/${{ matrix.front }}

      # Hors du _headers versionné, commun aux environnements : seule la
      # recette doit échapper aux moteurs de recherche. Cloudflare cumule les
      # en-têtes de toutes les règles qui correspondent.
      - name: Interdire l'indexation de la recette
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> "apps/${{ matrix.front }}/dist/_headers"

      # wrangler est épinglé dans le package.json racine : le CI déploie avec
      # la version testée en local.
      - name: Publier sur Cloudflare
        working-directory: apps/${{ matrix.front }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env recette

  # ------------------------------------------------------------------
  # CD production : tag v* → serveur de production
  #
  # Ce job duplique volontairement deploy-recette : les deux ne diffèrent que
  # par l'environnement, la condition et la stratégie de checkout (pull de main
  # contre checkout détaché du tag). TOUTE correction apportée à l'un doit être
  # reportée ici, sous peine de voir la production diverger de la recette.
  # ------------------------------------------------------------------
  deploy-production:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Métadonnées (tags image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short

      - name: BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Métadonnées (tags image API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & push de l'image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Déployer sur le serveur (SSH)
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Le nom du tag transite comme DONNÉE, pas par interpolation dans le
          # texte du script : git accepte des noms de tag contenant des
          # métacaractères shell, et une interpolation textuelle offrirait
          # l'exécution de commandes arbitraires sur le serveur de production.
          TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          envs: TAG
          script: |
            cd "${{ vars.APP_DIR || '/var/www/multiboutique' }}"
            git fetch origin --tags --force
            git checkout --detach "$TAG"
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.meta-api.outputs.version }}"
            bash deploy/server-deploy.sh up

      - name: Vérifier la santé de l'application
        run: |
          for tentative in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://${{ vars.DOMAIN }}/api/health")
            echo "Tentative ${tentative} : HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Application saine."
              exit 0
            fi
            sleep 10
          done
          echo "L'application ne répond pas 200 sur /api/health après déploiement." >&2
          exit 1

      # Tant que API_DOMAIN n'est pas défini (tunnel pas encore créé), l'API n'est
      # pas déployée par server-deploy.sh : rien à vérifier.
      - name: Vérifier la santé de l'API
        if: vars.API_DOMAIN != ''
        run: |
          for tentative in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://${{ vars.API_DOMAIN }}/health")
            echo "Tentative ${tentative} : HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "API saine."
              exit 0
            fi
            sleep 10
          done
          echo "L'API ne répond pas 200 sur /health après déploiement." >&2
          exit 1
