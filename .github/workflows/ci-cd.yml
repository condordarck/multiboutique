name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

# Un seul déploiement à la fois : deux pushes rapprochés lanceraient git pull
# et compose up en parallèle dans le même répertoire sur le serveur.
concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # CI : compilation (typecheck + build Next.js) sur chaque push / PR
  # ------------------------------------------------------------------
  build:
    name: Build & vérifications
    runs-on: ubuntu-latest
    # PostgreSQL réel pour les tests d'intégration de l'API (base clonée par
    # fichier de test, cf. apps/api/test/base.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests des workspaces
        run: npm test
        env:
          DATABASE_URL_TEST: postgres://postgres:test@localhost:5432/postgres

      - name: Typecheck des workspaces
        run: npm run typecheck

      - name: Build des workspaces
        run: npm run build:workspaces
        env:
          # Les fronts refusent de se construire sans l'hôte de leur API (CSP) et,
          # pour la vitrine, sans l'adresse du backoffice : ici des valeurs
          # fictives, ces builds ne sont pas déployés.
          VITE_API_URL: https://api.exemple.invalid
          VITE_BACKOFFICE_URL: https://backoffice.exemple.invalid

  # ------------------------------------------------------------------
  # Parcours de bout en bout du backoffice : Chromium, vraie API, vraie base
  # ------------------------------------------------------------------
  e2e:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/backoffice

      - name: Parcours du backoffice
        run: npm run e2e -w @multiboutique/backoffice
        env:
          DATABASE_URL_TEST: postgres://postgres:test@localhost:5432/postgres

      # La vitrine, avec le backoffice pour les parcours croisés.
      - name: Parcours de la vitrine
        if: success() || failure()
        run: npm run e2e -w @multiboutique/www
        env:
          DATABASE_URL_TEST: postgres://postgres:test@localhost:5432/postgres

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            apps/backoffice/playwright-report
            apps/backoffice/test-results
            apps/www/playwright-report
            apps/www/test-results
          retention-days: 7

  # ------------------------------------------------------------------
  # CD recette : push sur main → serveur de recette
  # ------------------------------------------------------------------
  deploy-recette:
    name: Déploiement recette
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    environment: recette
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Métadonnées (tags image API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short

      - name: BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L'API est désormais tout le serveur : sans image, rien ne se déploie.
      - name: Build & push de l'image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Déployer sur le serveur (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ vars.APP_DIR || '/var/www/multiboutique' }}"
            # Sans échec ici, une image neuve se déploierait sur un checkout
            # périmé : ancien compose, anciennes migrations, anciens scripts.
            git pull --ff-only origin main
            export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.meta-api.outputs.version }}"
            bash deploy/server-deploy.sh up

      # L'API par le tunnel, et les deux PWA (déployées par le job voisin).
      - name: Vérifier l'API et les fronts
        run: bash deploy/ci/verifier-sante.sh
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}

  # ------------------------------------------------------------------
  # CD recette des PWA : push sur main → Cloudflare Workers (fichiers statiques)
  #
  # Un Worker par front ET par environnement (mb-<front>-recette, voir
  # apps/<front>/wrangler.jsonc) : un déploiement de recette ne peut jamais
  # atteindre la production. Le déploiement crée lui-même le domaine
  # personnalisé et son enregistrement DNS.
  # ------------------------------------------------------------------
  deploy-fronts-recette:
    name: Fronts recette (${{ matrix.front }})
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    environment: recette
    permissions:
      contents: read
    strategy:
      # Les fronts sont indépendants : l'échec de l'un ne doit pas annuler
      # le déploiement de l'autre.
      fail-fast: false
      matrix:
        front: [www, backoffice, maquettes]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # api.<base> → backoffice.<base> : la vitrine mène à l'espace professionnel.
      - name: Adresses des fronts
        run: |
          # Sinon le lien « Espace professionnel » pointerait au mauvais endroit, sans erreur.
          case "$API_DOMAIN" in
            api.*) echo "VITE_BACKOFFICE_URL=https://backoffice.${API_DOMAIN#api.}" >> "$GITHUB_ENV" ;;
            *) echo "::error::API_DOMAIN doit être de la forme api.<base> (reçu : « $API_DOMAIN »)"; exit 1 ;;
          esac
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}

      - name: Build
        run: npm run build -w @multiboutique/${{ matrix.front }}
        env:
          # Hôte de l'API de l'environnement : les fronts l'écrivent dans leur CSP
          # (connect-src, img-src) ; sans lui, leur build échoue.
          VITE_API_URL: https://${{ vars.API_DOMAIN }}

      # Hors du _headers versionné, commun aux environnements : seule la
      # recette doit échapper aux moteurs de recherche. Cloudflare cumule les
      # en-têtes de toutes les règles qui correspondent.
      - name: Interdire l'indexation de la recette
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> "apps/${{ matrix.front }}/dist/_headers"

      # wrangler est épinglé dans le package.json racine : le CI déploie avec
      # la version testée en local.
      - name: Publier sur Cloudflare
        working-directory: apps/${{ matrix.front }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env recette

  # ------------------------------------------------------------------
  # CD production : tag v* → serveur de production et PWA de production
  #
  # Préparé, pas activé : la garde refuse tant que l'environnement GitHub
  # « production » (API_DOMAIN) et les env.production des wrangler.jsonc ne sont
  # pas configurés (docs/bascule-recette.md, section « Production »).
  # Ces jobs dupliquent volontairement ceux de la recette : toute correction
  # apportée à l'un doit être reportée sur l'autre.
  # ------------------------------------------------------------------
  garde-production:
    name: Garde production
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: La production est-elle configurée ?
        run: bash deploy/ci/garde-production.sh
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}

  deploy-production:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: [garde-production]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Métadonnées (tags image API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Déployer sur le serveur (SSH)
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Le nom du tag transite comme DONNÉE, pas par interpolation dans le
          # texte du script : git accepte des noms de tag contenant des
          # métacaractères shell, et une interpolation textuelle offrirait
          # l'exécution de commandes arbitraires sur le serveur de production.
          TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          envs: TAG
          script: |
            cd "${{ vars.APP_DIR || '/var/www/multiboutique' }}"
            git fetch origin --tags --force
            git checkout --detach "$TAG"
            export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.meta-api.outputs.version }}"
            bash deploy/server-deploy.sh up

  deploy-fronts-production:
    name: Fronts production (${{ matrix.front }})
    runs-on: ubuntu-latest
    needs: [garde-production]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        front: [www, backoffice]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Adresses des fronts
        run: echo "VITE_BACKOFFICE_URL=https://backoffice.${API_DOMAIN#api.}" >> "$GITHUB_ENV"
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}

      - name: Build
        run: npm run build -w @multiboutique/${{ matrix.front }}
        env:
          VITE_API_URL: https://${{ vars.API_DOMAIN }}

      # Pas de X-Robots-Tag ici : seule la recette en porte un. Les pages gardent
      # leur meta robots « noindex » (référencement non requis, spec §6.4).
      - name: Publier sur Cloudflare
        working-directory: apps/${{ matrix.front }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

  sante-production:
    name: Santé production
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-fronts-production]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier l'API et les fronts
        run: bash deploy/ci/verifier-sante.sh
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
