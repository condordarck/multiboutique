name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # CI : compilation (typecheck + build Next.js) sur chaque push / PR
  # ------------------------------------------------------------------
  build:
    name: Build & vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build Next.js (inclut le typecheck)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # ------------------------------------------------------------------
  # CD recette : push sur main → serveur de recette
  # ------------------------------------------------------------------
  deploy-recette:
    name: Déploiement recette
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: recette
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Métadonnées (tags image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déployer sur le serveur (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ vars.APP_DIR || '/home/arnaud/multiboutique' }}"
            git pull --ff-only origin main || true
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            bash deploy/server-deploy.sh up

      - name: Vérifier la santé de l'application
        run: |
          for tentative in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://${{ vars.DOMAIN }}/api/health" || echo "000")
            echo "Tentative ${tentative} : HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Application saine."
              exit 0
            fi
            sleep 10
          done
          echo "L'application ne répond pas 200 sur /api/health après déploiement." >&2
          exit 1

  # ------------------------------------------------------------------
  # CD production : tag v* → serveur de production
  # ------------------------------------------------------------------
  deploy-production:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Métadonnées (tags image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déployer sur le serveur (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ vars.APP_DIR || '/home/arnaud/multiboutique' }}"
            git fetch origin --tags --force
            git checkout --detach "${{ github.ref_name }}"
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            bash deploy/server-deploy.sh up

      - name: Vérifier la santé de l'application
        run: |
          for tentative in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://${{ vars.DOMAIN }}/api/health" || echo "000")
            echo "Tentative ${tentative} : HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Application saine."
              exit 0
            fi
            sleep 10
          done
          echo "L'application ne répond pas 200 sur /api/health après déploiement." >&2
          exit 1
