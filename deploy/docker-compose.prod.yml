# Application — profil PRODUCTION (serveur)
# Utilise l'image buildée par GitHub Actions sur GHCR.
# Les secrets sont lus depuis un fichier `.env` placé à côté de ce fichier.

services:
  db:
    image: postgres:16-alpine
    container_name: multiboutique-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mb
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant (ex: openssl rand -hex 16)}"
      POSTGRES_DB: multiboutique
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mb -d multiboutique"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - multiboutique

  app:
    image: "${IMAGE:?IMAGE manquant (ex: ghcr.io/vous/multiboutique:main)}"
    container_name: multiboutique-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "postgresql://mb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/multiboutique"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant (ex: openssl rand -hex 32)}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../public/uploads:/app/public/uploads
    networks:
      - multiboutique

  nginx:
    image: nginx:alpine
    container_name: multiboutique-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d
      - ../nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - multiboutique

networks:
  multiboutique:
    driver: bridge

volumes:
  pgdata: