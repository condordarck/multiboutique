# MultiBoutique sur le serveur — recette et production : PostgreSQL, l'API et
# Cloudflare Tunnel. Aucun port publié : l'API n'est joignable que par le tunnel,
# les PWA sont servies par Cloudflare. Le monolithe Next a été retiré (phase 5).
# Secrets et valeurs par environnement : deploy/.env (jamais commité).

# Sans ce nom, Docker déduit le projet du répertoire parent — « deploy » —, qui
# est un nom plausible pour un autre projet de cette machine partagée : un
# `docker compose down` voisin emporterait alors notre réseau et notre volume.
name: multiboutique

services:
  db:
    image: postgres:16-alpine
    container_name: multiboutique-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mb
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant (ex: openssl rand -hex 16)}"
      POSTGRES_DB: multiboutique
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../apps/api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Aucun port publié : la base n'est joignable que par le réseau Docker.
    # Les pg_dump passent par `docker compose exec`.
    healthcheck:
      # En TCP : pendant le premier démarrage, le serveur temporaire qui joue
      # init.sql n'écoute que sur le socket Unix (cf. server-deploy.sh).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mb -d multiboutique"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    networks:
      - multiboutique

  api:
    image: "${API_IMAGE:?API_IMAGE manquant (ex: ghcr.io/condordarck/multiboutique-api:main)}"
    container_name: multiboutique-api
    restart: unless-stopped
    # Aucun port publié : seul cloudflared l'atteint, par le réseau Docker.
    environment:
      DATABASE_URL: "postgresql://mb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/multiboutique"
      API_JWT_SECRET: "${API_JWT_SECRET:?API_JWT_SECRET manquant (ex: openssl rand -hex 32)}"
      ORIGINE_WWW: "${ORIGINE_WWW:?ORIGINE_WWW manquant (ex: https://www.morpion.cloud)}"
      ORIGINE_BACKOFFICE: "${ORIGINE_BACKOFFICE:?ORIGINE_BACKOFFICE manquant (ex: https://backoffice.morpion.cloud)}"
      UPLOADS_DIR: /donnees/uploads
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Images des produits, hors du dépôt (ignoré par Git), cf. deploy/lib/uploads.sh.
      - ../donnees/uploads:/donnees/uploads
    mem_limit: 384m
    networks:
      - multiboutique

  # Connexion sortante vers Cloudflare : publie api.<domaine> sans ouvrir de port
  # sur le VPS. Le nom d'hôte public pointe vers http://api:4000.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: multiboutique-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?TUNNEL_TOKEN manquant (jeton du tunnel Cloudflare)}"
    depends_on:
      - api
    mem_limit: 128m
    networks:
      - multiboutique

networks:
  multiboutique:
    driver: bridge

volumes:
  pgdata:
