# Application — profil PRODUCTION et RECETTE.
# Le reverse proxy n'est PAS dans ce fichier : il est fourni par l'hôte
# (Apache + certbot en recette, cf. deploy/setup-vhost.sh).
# Secrets et valeurs par environnement : deploy/.env (jamais commité).

# Sans ce nom, Docker déduit le projet du répertoire parent — « deploy » —, qui
# est un nom plausible pour un autre projet de cette machine partagée : un
# `docker compose down` voisin emporterait alors notre réseau et notre volume.
name: multiboutique

services:
  db:
    image: postgres:16-alpine
    container_name: multiboutique-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mb
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant (ex: openssl rand -hex 16)}"
      POSTGRES_DB: multiboutique
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../apps/api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Aucun port publié : la base n'est joignable que par le réseau Docker.
    # Les pg_dump passent par `docker compose exec`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mb -d multiboutique"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    networks:
      - multiboutique

  app:
    image: "${IMAGE:?IMAGE manquant (ex: ghcr.io/condordarck/multiboutique:main)}"
    container_name: multiboutique-prod
    restart: unless-stopped
    ports:
      # Jamais 0.0.0.0 : c'est le reverse proxy de l'hôte qui expose l'app.
      - "127.0.0.1:${APP_PORT:?APP_PORT manquant (recette: 3002)}:3000"
    environment:
      DATABASE_URL: "postgresql://mb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/multiboutique"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant (ex: openssl rand -hex 32)}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 640m
    networks:
      - multiboutique

  # --- API et Cloudflare Tunnel (phase 2) ---------------------------------
  # Profil « api » : server-deploy.sh ne l'active que si API_IMAGE, API_JWT_SECRET
  # et TUNNEL_TOKEN sont fournis, pour qu'un .env encore incomplet ne bloque pas
  # le déploiement du monolithe. Valeurs vides tolérées ici : l'API valide sa
  # propre configuration au démarrage et nomme la variable manquante.
  api:
    image: "${API_IMAGE:-}"
    container_name: multiboutique-api
    profiles: ["api"]
    restart: unless-stopped
    # Aucun port publié : seul cloudflared l'atteint, par le réseau Docker.
    environment:
      DATABASE_URL: "postgresql://mb:${POSTGRES_PASSWORD:-}@db:5432/multiboutique"
      API_JWT_SECRET: "${API_JWT_SECRET:-}"
      ORIGINE_WWW: "${ORIGINE_WWW:-}"
      ORIGINE_BACKOFFICE: "${ORIGINE_BACKOFFICE:-}"
      UPLOADS_DIR: /donnees/uploads
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Images des produits, hors du dépôt (ignoré par Git), cf. deploy/lib/uploads.sh.
      - ../donnees/uploads:/donnees/uploads
    mem_limit: 384m
    networks:
      - multiboutique

  # Connexion sortante vers Cloudflare : publie api.<domaine> sans ouvrir de port
  # sur le VPS. Le nom d'hôte public pointe vers http://api:4000.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: multiboutique-tunnel
    profiles: ["api"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    depends_on:
      - api
    mem_limit: 128m
    networks:
      - multiboutique

networks:
  multiboutique:
    driver: bridge

volumes:
  pgdata:
